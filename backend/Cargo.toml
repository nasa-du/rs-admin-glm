[package]
name = "rs-admin-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework (spec §0.1: axum 0.8.9)
axum = "0.8.9"
# Data layer (spec §0.1: sqlx 0.9.0, locked — no stable patches after 0.9.0)
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
] }
# Runtime
tokio = { version = "1", features = ["full"] }
# Middleware: Trace + Timeout + Compression; CORS intentionally NOT configured (ADR 0001)
tower-http = { version = "0.7.1", features = [
  "trace",
  "timeout",
  "compression-gzip",
] }
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Password hashing (spec §0.1: argon2 0.6, `Argon2::default()` = OWASP baseline)
argon2 = "0.6.0"
# OS entropy for initial-password generation (already in the tree via password-hash)
getrandom = "0.4"
# Error-body / future JSON serialization (camelCase contract, ADR 0003)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bootstrap ergonomics (module errors get a typed AppError from M1, see docs/spec.md §1)
anyhow = "1"
# Load backend/.env in development
dotenvy = "0.15"
