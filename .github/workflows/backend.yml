# Backend gate (issue #20, ADR 0004): fmt → clippy → sqlx migrate + offline
# prepare check → integration tests against a real Postgres 18.
#
# The workflow itself triggers on every PR and push to main; a `changes`
# job decides whether the gate runs. Path rules (backend sources, this
# workflow file, or any root-level file — including dotfiles; a
# `frontend/**`-only change skips it, and vice versa) are enforced at the
# JOB level on purpose: with workflow-level paths filtering, a PR that
# skips this workflow would leave a required status check hanging on
# "Expected" forever, so the gate job always reports — success or
# skipped, and skipped satisfies branch protection.
name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The service container below. #[sqlx::test] creates its per-test temp
  # databases on this server; sqlx migrate run applies migrations to the
  # base database first.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/rs_admin

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the diff base (PR target branch or the pre-push
          # commit) must be present locally.
          fetch-depth: 0

      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
          fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA" || true)"
          # An empty diff (unreadable base, e.g. a force push) falls back
          # to running the gate — never silently skip.
          if [ -z "$files" ] \
            || printf '%s\n' "$files" | grep -qE '^(backend/|\.github/workflows/backend\.yml$|[^/]+$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rs_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # The key reacts to the offline query cache the day compile-time
          # macros appear (ADR 0004); this crate is runtime-query only so
          # far, so the hash is empty for now.
          key: sqlx-${{ hashFiles('backend/.sqlx/**') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # sqlx-cli pinned to the sqlx version in Cargo.toml (0.9.0). No
      # --locked (ADR 0004); `postgres,rustls` because --no-default-features
      # drops the bundled database drivers — `rustls` alone builds a CLI
      # that rejects postgres:// URLs (ADR 0004 erratum, PR #22).
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls

      - name: Apply migrations
        run: cargo sqlx migrate run

      # Fails when the committed .sqlx cache would differ from what the
      # macros produce — once macros exist, this is the "no developer
      # database needed to build" guarantee (SQLX_OFFLINE). Today the crate
      # has no compile-time macros, so this is trivially green.
      - name: Check offline query cache
        run: cargo sqlx prepare --check

      - name: Test
        run: cargo test
